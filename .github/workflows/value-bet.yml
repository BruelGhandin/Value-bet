name: Value Bet - mise à jour automatique

on:
  schedule:
    - cron: "0 5 * * *"        # chaque jour à 05:00 UTC (06:00 à Brazzaville) : données, modèles, cotes
    - cron: "*/20 8-22 * * *"  # toutes les 20 minutes en journée : compositions et prédictions
  workflow_dispatch:
    inputs:
      mode:
        description: "full (tout) ou live (rapide)"
        default: "full"

concurrency:
  group: value-bet-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-ci.txt

      - run: pip install -r engine/requirements-ci.txt

      - name: Choisir le mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=live" >> "$GITHUB_OUTPUT"
          fi

      - name: Mettre à jour
        working-directory: engine
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # facultatif
        run: python daily.py --${{ steps.mode.outputs.mode }} --pwa-dir ..

      - name: Enregistrer les changements
        run: |
          git config user.name "value-bet-bot"
          git config user.email "value-bet-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "Mise à jour automatique (${{ steps.mode.outputs.mode }})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
